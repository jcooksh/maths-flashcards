<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Click-to-reveal flashcards for Edexcel A level Pure Maths revision and trigonometry.">
  <meta name="theme-color" content="#141a2e">
  <title>Maths flashcards · Edexcel A level</title>
  <link rel="stylesheet" href="./assets/katex/katex.min.css">
  <link rel="stylesheet" href="./styles.css?v=2">
  <script defer src="./assets/katex/katex.min.js"></script>
  <script defer src="./app.js?v=2"></script>
</head>
<body>
  <header class="mobile-header">
    <p class="brand"><span aria-hidden="true">∑</span> Maths flashcards</p>
    <button class="menu-button" id="open-topics" type="button" aria-haspopup="dialog" aria-controls="topics-dialog" aria-expanded="false">
      <span class="menu-dot" aria-hidden="true"></span>Topics
    </button>
  </header>

  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Study topics">
      <p class="brand"><span aria-hidden="true">∑</span> Maths flashcards</p>
      <div class="library" id="library">
        <nav class="topic-nav" aria-label="Flashcard categories">
          <div class="topic-group">
            <button class="group-button" data-deck="revision" type="button" aria-pressed="false" aria-label="All revision topics">Revision</button>
            <div class="topic-list" id="revision-topics"></div>
          </div>
          <div class="topic-group">
            <button class="group-button" data-deck="trigonometry" type="button" aria-pressed="false" aria-label="All trig rules">Trig rules</button>
            <div class="topic-list" id="trigonometry-topics"></div>
          </div>
          <button class="all-cards" data-deck="all" type="button" aria-pressed="false">
            <span>All cards</span><span id="count-all"></span>
          </button>
        </nav>
        <section class="progress-summary" aria-label="Progress on this device">
          <span><span id="known-count">0</span> known</span>
          <button data-deck="review" type="button" aria-pressed="false"><span id="count-review">0</span> to review</button>
        </section>
      </div>
    </aside>

    <main class="study">
      <div class="shape shape-green" aria-hidden="true"></div>
      <div class="shape shape-lilac" aria-hidden="true"></div>
      <div class="shape shape-gold" aria-hidden="true"></div>
      <div class="shape shape-navy" aria-hidden="true"></div>

      <div class="study-layout">
        <header class="study-header">
          <p class="position"><span id="collection-label">Revision</span><span id="position-label"></span></p>
          <h1 id="deck-title">Differentiation</h1>
          <div class="review-filter" id="review-filter" hidden>
            <label for="review-topic">Topic</label>
            <select id="review-topic">
              <option value="all">All topics</option>
            </select>
          </div>
        </header>

        <div id="loading" class="notice" role="status">Loading flashcards…</div>
        <div id="empty" class="notice" hidden>
          <p id="empty-message"></p>
          <button class="quiet-button" id="return-to-deck" type="button">Study all cards</button>
        </div>

        <section id="practice" aria-label="Flashcard practice" hidden>
          <button class="flashcard" id="flashcard" type="button" aria-pressed="false">
            <span class="card-face-label" id="card-face-label" hidden>Answer</span>
            <span class="card-content" id="card-content"></span>
            <span class="card-bottom">
              <span class="flip-hint" id="flip-hint">Tap to flip<span class="space-hint"> · Space</span></span>
              <span class="reference-label" id="reference-label" hidden></span>
            </span>
          </button>

          <div class="card-actions" role="group" aria-label="Flashcard actions">
            <button class="pill pill-review" id="review-card" type="button">Not yet</button>
            <button class="pill pill-flip" id="flip-card" type="button" aria-pressed="false">Show answer</button>
            <button class="pill pill-known" id="know-card" type="button">Got it</button>
          </div>
          <div class="card-navigation" role="group" aria-label="Flashcard navigation">
            <button class="quiet-button" id="previous" type="button">Previous</button>
            <button class="quiet-button" id="shuffle" type="button">Shuffle</button>
            <button class="quiet-button" id="next" type="button">Next card</button>
          </div>
        </section>

        <footer class="sources">
          <span>Edexcel A level Pure Maths · 9MA0</span>
          <div class="source-links">
            <a href="https://qualifications.pearson.com/content/dam/pdf/A%20Level/Mathematics/2017/specification-and-sample-assesment/a-level-l3-mathematics-specification-issue4.pdf">Specification</a>
            <a href="https://qualifications.pearson.com/content/dam/pdf/A%20Level/Mathematics/2017/specification-and-sample-assesment/pearson-edexcel-l3-advanced-gce-mathematics-9ma0-enhanced-content-guidance-issue-2.pdf">Content guidance</a>
            <a href="https://qualifications.pearson.com/content/dam/pdf/A%20Level/Mathematics/2017/specification-and-sample-assesment/pearson-edexcel-a-level-gce-in-mathematics-formulae-book.pdf">Formula booklet</a>
          </div>
        </footer>
        <p class="visually-hidden" id="announcer" role="status"></p>
        <noscript><p class="notice">Enable JavaScript to use the flashcards.</p></noscript>
      </div>
    </main>
  </div>

  <dialog class="topics-dialog" id="topics-dialog" aria-labelledby="topics-title">
    <header class="mobile-header">
      <p class="brand" id="topics-title"><span aria-hidden="true">∑</span> Maths flashcards</p>
      <form method="dialog"><button class="menu-button" type="submit" autofocus>Close</button></form>
    </header>
    <div id="mobile-library"></div>
  </dialog>
</body>
</html>
